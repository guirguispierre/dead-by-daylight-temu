<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dead by Daylight: Temu Edition</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0a0a0f;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
    }
    #game3d {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }
    #game {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1; /* HUD + 2D view layer above the WebGL canvas */
    }
  </style>
</head>
<body>
  <canvas id="game3d"></canvas>
  <canvas id="game"></canvas>
  <script type="module" src="src/main.js"></script>
</body>
</html>
